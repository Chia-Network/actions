name: "Windows Code Sign"
description: "Retired. Use Chia-Network/actions/sign/azure-windows instead."
inputs:
  sm_tools_download_url:
    description: "Unused. This action is retired."
    default: "https://one.digicert.com/signingmanager/api-ui/v1/releases/smtools-windows-x64.msi/download"
    required: false
  sm_host:
    description: "Unused. This action is retired."
    default: "https://clientauth.one.digicert.com"
    required: false
  sm_api_key:
    description: "Unused. This action is retired."
    required: false
  sm_client_cert_file_b64:
    description: "Unused. This action is retired."
    required: false
  sm_client_cert_password:
    description: "Unused. This action is retired."
    required: false
  sm_code_signing_cert_sha1_hash:
    description: "Unused. This action is retired."
    required: false
  sm_certkey_alias:
    description: "Unused. This action is retired."
    required: false
  sign:
    description: "Unused. This action is retired."
    required: false
    default: "true"
  file:
    description: "Unused. This action is retired."
    required: false
runs:
  using: "composite"
  steps:
    - name: DigiCert Windows signing is retired
      shell: bash
      run: |
        {
          echo "::error title=DigiCert Windows signing is retired::Chia-Network/actions/digicert/windows-sign no longer works. DigiCert Signing Manager rejects the SM_* credentials (HTTP 403 Invalid credentials). Switch this job to Chia-Network/actions/sign/azure-windows. The calling job must run on Windows, use environment windows-code-signing, set permissions.id-token: write, and pass AZURE_SIGNING_TENANT_ID / AZURE_SIGNING_CLIENT_ID from secrets."
          echo "Chia-Network/actions/digicert/windows-sign is retired."
          echo "DigiCert Signing Manager rejects the SM_* credentials (HTTP 403 Invalid credentials)."
          echo "Use Chia-Network/actions/sign/azure-windows instead."
          echo "Calling job requirements: Windows runner, environment: windows-code-signing,"
          echo "permissions.id-token: write, secrets AZURE_SIGNING_TENANT_ID and AZURE_SIGNING_CLIENT_ID."
        } >&2
        exit 1
