name: "Build Multiarch Docker Image with Remote AWS ARM Builder"
description: "Deprecated. Fails immediately. No callers remain; build arm64 on a GitHub-hosted ARM runner."
inputs:
  aws_account_id:
    description: "The AWS account ID to launch the remote instance in. Required for the assume role action"
    required: true
  aws_role:
    description: "The role to assume to create the remote arm builder. Required for the assume role action"
    required: true
  aws_region:
    description: "The region to launch the remote arm builder in. Required for the assume role action"
    required: true
  aws_vpc_id:
    description: "The VPC to launch the instance into"
    required: true
  aws_subnet_id:
    description: "The subnet to launch the instance into"
    required: true
  aws_ami_pattern:
    description: "The Pattern to use to match the AMI to launch. Will launch the newest version matching this pattern"
    required: true
    default: "Chia_Buildx_Remote-arm64-*"
  aws_instance_type:
    description: "The type of instance to launch"
    required: true
    default: "t4g.large"
  aws_keypair_name:
    description: "The SSH Keypair to associate with the instance"
    required: true
  aws_volume_size:
    description: "The size of the volume in the buidler instance"
    required: true
    default: "30"
  docker-platforms:
    description: "The OS/arch platforms to pass to docker buildx"
    required: false
    default: "linux/amd64,linux/arm64"
  docker-context:
    description: "The docker build context directory"
    required: false
    default: .
  dockerfile:
    description: "The path to a Dockerfile"
    required: false
    default: "./Dockerfile"
  image_subpath:
    description: "Set this to a string sub-path to publish your image under"
    required: false
  build-args:
    description: "Sets some docker build args"
    required: false
    default: ""
  additional-tag:
    description: "Set this to another tag name you'd like to publish"
    required: false
    default: ""
  alternate-latest-mode:
    description: "This creates a :latest tag on the default branch if set to true"
    required: false
    default: "false"
  push:
    description: "Whether or not to attempt to push the image to the registry"
    required: false
    default: "true"
  enable-cache:
    description: "Should the builds use docker cache"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Remote ARM build is deprecated
      shell: bash
      run: |
        {
          echo "::error title=Remote ARM build is deprecated::Chia-Network/actions/docker/remote-arm-build is deprecated and has no callers. It used to launch a short-lived EC2 BuildKit instance for linux/arm64. Build arm64 on a GitHub-hosted ARM runner with docker/build instead. This step fails before any AWS API calls."
          echo "Chia-Network/actions/docker/remote-arm-build is deprecated."
          echo "It has no callers. coinset-org/server now builds arm64 on GitHub-hosted ARM runners."
          echo "Use Chia-Network/actions/docker/build instead of this action."
          echo "This step fails before any AWS API calls."
        } >&2
        exit 1
